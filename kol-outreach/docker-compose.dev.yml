# =============================================================================
# 本地开发数据库（仅 dev，请勿部署到生产）
# =============================================================================
#
# 用途：在本地用 Docker 跑一个 PostgreSQL，模仿 docker-compose.prod.yml 里
#       db 服务的结构，供后端（宿主机 uvicorn）通过 localhost:5432 连接。
#
# 启停：
#   docker compose -f docker-compose.dev.yml up -d      # 启动
#   docker compose -f docker-compose.dev.yml down        # 停止（保留数据卷）
#   docker compose -f docker-compose.dev.yml down -v     # ⚠️ 连数据卷一起删，慎用
#
# 注意：根目录 docker-compose.yml 里的 backend 仍写着 sqlite:///...，
#       那是早期遗留配置，已废弃。本地后端实际通过 backend/.env 的
#       DATABASE_URL=postgresql+psycopg2://kol:...@localhost:5432/kol_outreach
#       连接本文件定义的 db 服务，不使用 docker-compose.yml。
#
# 与 docker-compose.prod.yml 的差异（刻意保留的 dev 便利）：
#   - 端口 5432 暴露到宿主机，方便用 DataGrip/pgAdmin 直连
#   - 密码用弱口令软默认（local-dev-password），仅本机使用
#   - 不含 backend/frontend/traefik，后端仍在宿主机 uvicorn 热重载
# =============================================================================

services:
  db:
    image: postgres:16-alpine
    container_name: kol-local-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: kol_outreach
      POSTGRES_USER: kol
      # 弱口令软默认：仅本地。如需覆盖，在同级 .env 里设 POSTGRES_PASSWORD。
      # ⚠️ 改密码后需同步改 backend/.env 的 DATABASE_URL，并重建数据卷。
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-local-dev-password}
    ports:
      - "5432:5432"
    volumes:
      - kol-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kol"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  kol-db-data:
    name: kol-db-data
