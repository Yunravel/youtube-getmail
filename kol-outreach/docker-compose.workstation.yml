# Windows 工作站迁移版：PostgreSQL + FastAPI + Vue/Caddy
# 启动请使用 tools/install-workstation.ps1，不要直接跳过数据库恢复步骤。
services:
  db:
    image: postgres:16-alpine
    container_name: kol-workstation-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: kol_outreach
      POSTGRES_USER: kol
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Missing POSTGRES_PASSWORD in .env.prod}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - workstation-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kol -d kol_outreach"]
      interval: 5s
      timeout: 5s
      retries: 30

  backend:
    build: ./backend
    container_name: kol-workstation-backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - ./backend/.env
    environment:
      DATABASE_URL: postgresql+psycopg2://kol:${POSTGRES_PASSWORD}@db:5432/kol_outreach
      # 工作站永远不是生产:硬编码 local,即使 env_file 里混入生产飞书凭据,
      # config 层的环境守卫也会拒绝写生产表(2026-07-27 本地覆盖生产行事故)。
      APP_ENV: local
      DEBUG: "false"
      HOST: 0.0.0.0
      PORT: 8000
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-}
      OPENAI_MODEL_INTENT: ${OPENAI_MODEL_INTENT:-gpt-4o-mini}
      OPENAI_MODEL_PERSONALIZE: ${OPENAI_MODEL_PERSONALIZE:-gpt-4o}
      SNOV_WEBHOOK_TOKEN: ${SNOV_WEBHOOK_TOKEN}
      SNOV_CLIENT_ID: ${SNOV_CLIENT_ID:-}
      SNOV_CLIENT_SECRET: ${SNOV_CLIENT_SECRET:-}
      SNOV_SYNC_ENABLED: ${SNOV_SYNC_ENABLED:-true}
      SNOV_SYNC_INTERVAL_SECONDS: ${SNOV_SYNC_INTERVAL_SECONDS:-120}
      IMAP_SYNC_ENABLED: ${IMAP_SYNC_ENABLED:-true}
      IMAP_PROXY_ENABLED: ${IMAP_PROXY_ENABLED:-false}
      IMAP_PROXY_HOST: ${IMAP_PROXY_HOST:-}
      IMAP_PROXY_PORT: ${IMAP_PROXY_PORT:-}
      SMTP_PROXY_ENABLED: ${SMTP_PROXY_ENABLED:-false}
      SMTP_PROXY_HOST: ${SMTP_PROXY_HOST:-}
      SMTP_PROXY_PORT: ${SMTP_PROXY_PORT:-}
      AUTO_REPLY_POLL_SECONDS: ${AUTO_REPLY_POLL_SECONDS:-30}
    ports:
      - "127.0.0.1:${BACKEND_PORT:-8000}:8000"
    volumes:
      - workstation-backend-logs:/app/logs
      - workstation-backend-data:/app/data

  frontend:
    build:
      context: ./frontend
      args:
        VITE_SNOV_INBOX_URL: ${VITE_SNOV_INBOX_URL:-}
    container_name: kol-workstation-frontend
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "127.0.0.1:${FRONTEND_PORT:-8080}:80"

volumes:
  workstation-db-data:
    name: kol-workstation-db-data
  workstation-backend-logs:
    name: kol-workstation-backend-logs
  workstation-backend-data:
    name: kol-workstation-backend-data
