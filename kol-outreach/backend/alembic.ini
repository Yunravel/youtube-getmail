# Alembic database migration configuration.
#
# sqlalchemy.url stays empty. env.py reads DATABASE_URL from config.settings,
# so SQLite/PostgreSQL selection remains consistent with the application.
#
# Run commands from backend/:
#   alembic current
#   alembic upgrade head
#   alembic downgrade base       (destructive; drops migrated objects)
#   alembic stamp head
#   alembic revision -m "xxx"

[alembic]
script_location = alembic
sqlalchemy.url =

# Optional file name template for new revisions.
# file_template = %%(year)d%%(month).2d%%(day).2d_%%(hour).2d%%(minute).2d_%%(rev)s_%%(slug)s

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
