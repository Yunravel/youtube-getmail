# Alembic 配置 - 数据库迁移
#
# sqlalchemy.url 留空，实际的 DATABASE_URL 在 env.py 里从 config.settings 读取。
# 这样开发用 SQLite / 生产用 PostgreSQL 的切换由环境变量控制，与主应用一致。
#
# 常用命令（在 backend/ 目录下执行）:
#   alembic current              查看当前版本
#   alembic upgrade head         升级到最新
#   alembic downgrade base       回滚到初始（慎用，会 drop 表）
#   alembic stamp head           把现有库标记为已到 head（不执行 SQL，用于对齐基线）
#   alembic revision -m "xxx"    生成新空 revision

[alembic]
script_location = alembic
sqlalchemy.url =

# 模板生成新 revision 时的默认文件头
# file_template = %%(year)d%%(month).2d%%(day).2d_%%(hour).2d%%(minute).2d_%%(rev)s_%%(slug)s

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
